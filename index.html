<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13181B" />

    <!-- Meta (Facebook) Pixel — only initializes when VITE_META_PIXEL_ID is set. -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      (function () {
        var PIXEL_ID = "%VITE_META_PIXEL_ID%";
        // Guard against an unset/unreplaced env var so we never init a bogus pixel.
        if (PIXEL_ID && PIXEL_ID.indexOf("%") === -1) {
          fbq("init", PIXEL_ID);
          fbq("track", "PageView");
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="description"
      content="סדנה לייב אינטנסיבית בזום: לומדים בפרקטיקה איך לאתר, לנתח ולהגיש הצעה ראשונה על נכס בארה״ב תוך 4 שעות לייב, בלי תוכנות יקרות ובלי תיאוריות. יומיים מרוכזים, 2 & 3 בספטמבר. כולל מחשבונים, תסריטים ואחריות מלאה להחזר."
    />

    <!-- Open Graph / social + WhatsApp preview -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="סדנת כניסה לעולם הנדל״ן · אוהד עוז" />
    <meta property="og:title" content="סדנת כניסה לעולם הנדל״ן" />
    <meta
      property="og:description"
      content="4 שעות עבודה מעשית בלייב עם יזם נדל״ן פעיל בארה״ב, יוצאים עם הצעה מוכנה להגשה. מספר המקומות מוגבל."
    />
    <meta property="og:image" content="/images/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="סדנת כניסה לעולם הנדל״ן" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="סדנת כניסה לעולם הנדל״ן" />
    <meta
      name="twitter:description"
      content="4 שעות עבודה מעשית בלייב עם יזם נדל״ן פעיל בארה״ב, יוצאים עם הצעה מוכנה להגשה."
    />
    <meta name="twitter:image" content="/images/og-cover.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>סדנת כניסה לעולם הנדל״ן</title>
  </head>
  <body>
    <!-- Meta Pixel <noscript> fallback (valid only in body, not head). -->
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        alt=""
        src="https://www.facebook.com/tr?id=%VITE_META_PIXEL_ID%&ev=PageView&noscript=1"
      />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
